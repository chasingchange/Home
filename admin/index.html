<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Chasing Change</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Muli:wght@300;400;600;700&family=Museo+Moderno:wght@500;700&family=Raleway:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared.css" />
    <script src="../shared-global-nav.js" defer></script>
    <script src="../shared-coach.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cc: { text: "#071f35", bg: "#f5f5f7", outline: "#dcd1ff", card: "#ffffff" },
            },
            fontFamily: {
              body:    ["Muli", "Mulish", "system-ui", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
              heading: ["Raleway", "system-ui", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
              brand:   ["Museo Moderno", "Raleway", "sans-serif"],
            },
            boxShadow: {
              soft: "0 10px 30px rgba(7,31,53,0.10)",
              neon: "0 24px 80px rgba(220, 209, 255,0.30)",
            },
          },
        },
      };
    </script>
  </head>

  <body class="min-h-screen bg-cc-bg text-cc-text font-body cc-page">
    <div class="relative max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-12">

      <!-- Background blobs -->
      <div class="absolute inset-0 -z-10 pointer-events-none">
        <div class="absolute -top-16 right-8 w-72 h-72 bg-cc-outline/30 blur-3xl rounded-full"></div>
        <div class="absolute top-40 -left-12 w-72 h-72 bg-cc-text/15 blur-3xl rounded-full"></div>
      </div>

      <!-- Header -->
      <header class="rounded-3xl overflow-hidden ring-1 ring-black/5 shadow-neon bg-white mb-6 sm:mb-8">
        <div class="relative p-6 sm:p-8">
          <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-cc-outline/20 blur-3xl"></div>
          <div class="relative flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <a href="../index.html">
                <img src="../Logo.png" alt="Chasing Change logo" class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl ring-1 ring-black/10 bg-white/70 p-1" />
              </a>
              <div>
                <a href="../index.html" class="text-2xl sm:text-3xl font-extrabold font-brand leading-tight hover:text-cc-outline transition">Chasing Change</a>
                <p class="text-sm font-bold font-heading opacity-60">Admin Panel</p>
              </div>
            </div>
            <span class="hidden sm:inline-flex items-center gap-1.5 rounded-xl bg-cc-text px-3 py-1.5 text-xs font-extrabold text-white">
              <span class="w-1.5 h-1.5 rounded-full bg-cc-outline"></span>Admin
            </span>
          </div>
        </div>
      </header>

      <!-- Toast notification -->
      <div id="toast" class="fixed top-4 right-4 z-50 hidden max-w-sm rounded-2xl bg-cc-text px-5 py-3.5 text-sm font-bold text-white shadow-soft transition-all">
        <span id="toastMsg"></span>
      </div>

      <!-- ════════════════════════════════════════════════════════════
           ADMIN GATE  (shown when not authenticated)
      ════════════════════════════════════════════════════════════ -->
      <div id="adminGate" class="max-w-md mx-auto">
        <section class="rounded-3xl bg-white ring-1 ring-black/5 shadow-soft p-7 sm:p-9">
          <div class="mb-4 h-1.5 w-12 rounded-full bg-cc-outline/70"></div>
          <h2 class="text-xl font-extrabold font-heading">Admin Access</h2>
          <p class="mt-1 text-sm opacity-60">Enter your admin password to continue.</p>
          <form id="adminGateForm" class="mt-5 grid gap-3" novalidate>
            <label class="relative block">
              <input id="adminPasswordInput" type="password" placeholder="Admin password" autocomplete="current-password"
                class="w-full rounded-xl bg-cc-bg px-4 py-3 pr-16 ring-1 ring-black/10 transition focus:outline-none focus:ring-2 focus:ring-cc-outline/70" />
              <button id="gatePasswordToggle" type="button"
                class="absolute inset-y-2 right-2 rounded-xl bg-white px-3 text-xs font-extrabold text-cc-text ring-1 ring-black/10 transition hover:bg-black/5"
                aria-pressed="false">Show</button>
            </label>
            <div id="gateError" class="hidden rounded-xl bg-red-50 ring-1 ring-red-200 px-4 py-3 text-sm font-semibold text-red-700"></div>
            <button type="submit" class="rounded-xl bg-cc-outline px-5 py-3 text-sm font-extrabold text-cc-text transition hover:brightness-95">
              Enter Admin
            </button>
          </form>
        </section>
      </div>

      <!-- ════════════════════════════════════════════════════════════
           ADMIN PANEL  (shown after authentication)
      ════════════════════════════════════════════════════════════ -->
      <div id="adminPanel" class="hidden">

        <!-- Status bar -->
        <div class="mb-5 flex flex-wrap items-center justify-end gap-3 rounded-2xl bg-white ring-1 ring-black/10 px-5 py-3.5">
          <button id="adminLogoutBtn" type="button"
            class="rounded-xl bg-cc-bg px-3 py-1.5 text-xs font-extrabold text-cc-text ring-1 ring-black/10 transition hover:bg-black/5">
            Exit Admin
          </button>
        </div>

        <!-- Coach dashboard -->
        <section class="mb-6 rounded-3xl bg-white ring-1 ring-black/5 shadow-soft p-6 sm:p-8">
          <div class="mb-4 h-1.5 w-12 rounded-full bg-cc-outline/70"></div>
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-lg font-extrabold font-heading">Coach Dashboard</h2>
              <p class="mt-1 text-sm opacity-60">Manage client profiles and saved tool records.</p>
            </div>
            <a href="../macro/index.html" class="rounded-xl bg-cc-bg px-3 py-1.5 text-xs font-extrabold text-cc-text ring-1 ring-black/10 transition hover:bg-black/5">Open Macro Calculator</a>
          </div>

          <div class="mt-5 grid gap-3 sm:grid-cols-[1fr_auto]">
            <input id="coachClientSearch" type="text" placeholder="Search clients by name, email, phone, notes…"
              class="w-full rounded-xl bg-cc-bg px-4 py-3 ring-1 ring-black/10 transition focus:outline-none focus:ring-2 focus:ring-cc-outline/70" />
            <button id="coachRefreshBtn" type="button"
              class="rounded-xl bg-cc-outline px-5 py-3 text-sm font-extrabold text-cc-text transition hover:brightness-95">Refresh</button>
          </div>

          <div class="mt-4 grid gap-4 lg:grid-cols-2">
            <div>
              <h3 class="text-sm font-extrabold uppercase tracking-wide opacity-60">Client List</h3>
              <div id="coachClientList" class="mt-2 grid gap-2"></div>
            </div>
            <div>
              <h3 class="text-sm font-extrabold uppercase tracking-wide opacity-60">Client Profile</h3>
              <form id="coachClientForm" class="mt-2 grid gap-2">
                <input id="coachClientName" type="text" placeholder="Full name"
                  class="w-full rounded-xl bg-cc-bg px-4 py-3 ring-1 ring-black/10 transition focus:outline-none focus:ring-2 focus:ring-cc-outline/70" />
                <input id="coachClientEmail" type="email" placeholder="Email (optional)"
                  class="w-full rounded-xl bg-cc-bg px-4 py-3 ring-1 ring-black/10 transition focus:outline-none focus:ring-2 focus:ring-cc-outline/70" />
                <input id="coachClientPhone" type="text" placeholder="Phone (optional)"
                  class="w-full rounded-xl bg-cc-bg px-4 py-3 ring-1 ring-black/10 transition focus:outline-none focus:ring-2 focus:ring-cc-outline/70" />
                <textarea id="coachClientNotes" rows="3" placeholder="Coach notes"
                  class="w-full rounded-xl bg-cc-bg px-4 py-3 ring-1 ring-black/10 transition focus:outline-none focus:ring-2 focus:ring-cc-outline/70"></textarea>
                <input id="coachClientId" type="hidden" />
                <div class="flex flex-wrap gap-2">
                  <button id="coachCreateClientBtn" type="button" class="rounded-xl bg-cc-outline px-4 py-2 text-sm font-extrabold text-cc-text transition hover:brightness-95">Create Client</button>
                  <button id="coachUpdateClientBtn" type="button" class="rounded-xl bg-cc-bg px-4 py-2 text-sm font-extrabold text-cc-text ring-1 ring-black/10 transition hover:bg-black/5">Update Client</button>
                  <button id="coachArchiveClientBtn" type="button" class="rounded-xl bg-cc-bg px-4 py-2 text-sm font-extrabold text-cc-text ring-1 ring-black/10 transition hover:bg-black/5">Archive Client</button>
                </div>
                <p id="coachClientFormMsg" class="text-xs font-semibold opacity-70"></p>
              </form>
            </div>
          </div>

          <div class="mt-5 grid gap-4 lg:grid-cols-2">
            <div>
              <h3 class="text-sm font-extrabold uppercase tracking-wide opacity-60">Recently Updated</h3>
              <div id="coachRecentUpdates" class="mt-2 grid gap-2"></div>
            </div>
            <div>
              <h3 class="text-sm font-extrabold uppercase tracking-wide opacity-60">Tool Records</h3>
              <div id="coachToolRecords" class="mt-2 grid gap-2"></div>
            </div>
          </div>
        </section>

      </div><!-- /adminPanel -->

</div>

    <script>
      // ================================================================
      //  ADMIN PASSWORD — Change this before deploying!
      // ================================================================
      const ADMIN_PASSWORD = "ChasingChange2026!";
      // ================================================================

      const coachApi = window.ChasingChangeCoach;

      // ── Toast ─────────────────────────────────────────────────────
      let toastTimer = null;
      function showToast(msg, duration = 3000) {
        const toast = document.getElementById("toast");
        document.getElementById("toastMsg").textContent = msg;
        toast.classList.remove("hidden");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.add("hidden"), duration);
      }

      // ── Admin auth ────────────────────────────────────────────────
      function isAdminAuthed() {
        return sessionStorage.getItem("ccAdminAuthed") === "1";
      }

      let selectedCoachClientId = "";

      function showAdminPanel() {
        document.getElementById("adminGate").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        renderCoachDashboard();
      }

      // Check on load
      if (isAdminAuthed()) showAdminPanel();

      // Gate form
      const gatePasswordInput = document.getElementById("adminPasswordInput");
      document.getElementById("gatePasswordToggle")?.addEventListener("click", function () {
        const show = gatePasswordInput.type === "password";
        gatePasswordInput.type = show ? "text" : "password";
        this.textContent = show ? "Hide" : "Show";
        this.setAttribute("aria-pressed", String(show));
      });

      document.getElementById("adminGateForm")?.addEventListener("submit", (e) => {
        e.preventDefault();
        const val = gatePasswordInput.value;
        if (val === ADMIN_PASSWORD) {
          sessionStorage.setItem("ccAdminAuthed", "1");
          showAdminPanel();
        } else {
          const err = document.getElementById("gateError");
          err.textContent = "Incorrect password.";
          err.classList.remove("hidden");
          gatePasswordInput.value = "";
          gatePasswordInput.focus();
        }
      });

      // Exit admin
      document.getElementById("adminLogoutBtn")?.addEventListener("click", () => {
        sessionStorage.removeItem("ccAdminAuthed");
        document.getElementById("adminPanel").classList.add("hidden");
        document.getElementById("adminGate").classList.remove("hidden");
        gatePasswordInput.value = "";
      });

      function fillCoachClientForm(client = null) {
        document.getElementById("coachClientId").value = client?.id || "";
        document.getElementById("coachClientName").value = client?.name || "";
        document.getElementById("coachClientEmail").value = client?.email || "";
        document.getElementById("coachClientPhone").value = client?.phone || "";
        document.getElementById("coachClientNotes").value = client?.notes || "";
        selectedCoachClientId = client?.id || "";
        if (client?.id) coachApi?.setActiveClientId?.(client.id);
      }

      function setCoachFormMessage(message, isError = false) {
        const el = document.getElementById("coachClientFormMsg");
        el.textContent = message || "";
        el.classList.toggle("text-red-700", !!isError);
        el.classList.toggle("opacity-70", !isError);
      }

      function renderCoachDashboard() {
        if (!coachApi) return;
        const search = document.getElementById("coachClientSearch")?.value || "";
        const clients = coachApi.listClients({ search }) || [];
        const listEl = document.getElementById("coachClientList");
        const recentEl = document.getElementById("coachRecentUpdates");
        const toolsEl = document.getElementById("coachToolRecords");
        const activeClientId = selectedCoachClientId || coachApi.getActiveClientId();

        listEl.innerHTML = clients.length
          ? clients.map((client) => {
            const toolCount = Object.keys(client.toolData || {}).length;
            return `<button type="button" data-client-id="${client.id}" class="text-left rounded-xl px-3 py-2 ring-1 transition ${activeClientId === client.id ? "bg-cc-outline/20 ring-cc-outline/50" : "bg-cc-bg ring-black/10 hover:bg-black/5"}">
              <p class="text-sm font-extrabold">${client.name}</p>
              <p class="text-xs opacity-70">${client.email || "No email"} · ${toolCount} tool records</p>
            </button>`;
          }).join("")
          : `<p class="rounded-xl bg-cc-bg px-3 py-2 text-sm opacity-70 ring-1 ring-black/10">No clients found. Create one to start saving tool data.</p>`;

        const recent = [...clients].slice(0, 5);
        recentEl.innerHTML = recent.length
          ? recent.map((client) => `<div class="rounded-xl bg-cc-bg px-3 py-2 ring-1 ring-black/10">
              <p class="text-sm font-bold">${client.name}</p>
              <p class="text-xs opacity-70">Updated ${new Date(client.updatedAt).toLocaleString()}</p>
            </div>`).join("")
          : `<p class="rounded-xl bg-cc-bg px-3 py-2 text-sm opacity-70 ring-1 ring-black/10">No recent updates yet.</p>`;

        const active = clients.find((client) => client.id === activeClientId) || coachApi.getClientById(activeClientId);
        const toolEntries = Object.entries(active?.toolData || {});
        toolsEl.innerHTML = active && toolEntries.length
          ? toolEntries.map(([toolKey, value]) => `<div class="rounded-xl bg-cc-bg px-3 py-2 ring-1 ring-black/10">
              <p class="text-sm font-extrabold">${toolKey}</p>
              <p class="text-xs opacity-70">Last updated ${new Date(value.updatedAt).toLocaleString()}</p>
            </div>`).join("")
          : `<p class="rounded-xl bg-cc-bg px-3 py-2 text-sm opacity-70 ring-1 ring-black/10">Select a client to view tool records.</p>`;

        listEl.querySelectorAll("[data-client-id]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const client = coachApi.getClientById(btn.dataset.clientId);
            fillCoachClientForm(client);
            renderCoachDashboard();
          });
        });

        if (active) fillCoachClientForm(active);
      }

      document.getElementById("coachRefreshBtn")?.addEventListener("click", renderCoachDashboard);
      document.getElementById("coachClientSearch")?.addEventListener("input", renderCoachDashboard);
      document.getElementById("coachCreateClientBtn")?.addEventListener("click", () => {
        const result = coachApi?.createClient?.({
          name: document.getElementById("coachClientName").value,
          email: document.getElementById("coachClientEmail").value,
          phone: document.getElementById("coachClientPhone").value,
          notes: document.getElementById("coachClientNotes").value,
        });
        if (!result?.ok) {
          setCoachFormMessage(result?.error || "Unable to create client.", true);
          return;
        }
        setCoachFormMessage(`Created ${result.client.name}.`);
        fillCoachClientForm(result.client);
        renderCoachDashboard();
      });

      document.getElementById("coachUpdateClientBtn")?.addEventListener("click", () => {
        const clientId = document.getElementById("coachClientId").value;
        const result = coachApi?.updateClient?.(clientId, {
          name: document.getElementById("coachClientName").value,
          email: document.getElementById("coachClientEmail").value,
          phone: document.getElementById("coachClientPhone").value,
          notes: document.getElementById("coachClientNotes").value,
        });
        if (!result?.ok) {
          setCoachFormMessage(result?.error || "Unable to update client.", true);
          return;
        }
        setCoachFormMessage(`Updated ${result.client.name}.`);
        fillCoachClientForm(result.client);
        renderCoachDashboard();
      });

      document.getElementById("coachArchiveClientBtn")?.addEventListener("click", () => {
        const clientId = document.getElementById("coachClientId").value;
        if (!clientId) {
          setCoachFormMessage("Choose a client first.", true);
          return;
        }
        const confirmed = window.confirm("Archive this client? Tool records remain available in storage if needed.");
        if (!confirmed) return;
        const result = coachApi?.deleteOrArchiveClient?.(clientId);
        if (!result?.ok) {
          setCoachFormMessage(result?.error || "Unable to archive client.", true);
          return;
        }
        setCoachFormMessage("Client archived.");
        fillCoachClientForm(null);
        renderCoachDashboard();
      });

      window.addEventListener("cc-coach-clients-changed", renderCoachDashboard);
    </script>
  
    <footer class="w-full px-5 pb-5 sm:px-8">
      <p class="text-center text-xs text-cc-text/70 sm:text-sm">© 2026 Chasing Change — 1% better every day.</p>
    </footer>

  </body>
</html>
