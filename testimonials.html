<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/Logo.png" />
    <link rel="apple-touch-icon" href="/Logo.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chasing Change — Testimonials</title>
    <meta name="description" content="Client testimonials for Chasing Change coaching." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Muli:wght@300;400;600;700&family=Museo+Moderno:wght@500;700&family=Raleway:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./shared.css" />
    <script src="./shared-global-nav.js" defer></script>
    <script src="./shared-global-footer.js" defer></script>
    <script src="./shared-testimonials.js"></script>

    <style>
      .hidden {
        display: none !important;
      }

      body {
        margin: 0;
        background: #fbfbfc;
        font-family: "Muli", "Mulish", system-ui, sans-serif;
        color: #071f35;
      }

      .tst-hero {
        max-width: 820px;
        margin: 0 auto;
        padding: 64px 24px 40px;
        text-align: center;
      }

      .tst-eyebrow {
        margin: 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(7, 31, 53, 0.4);
      }

      .tst-title {
        font-family: "Raleway", sans-serif;
        font-weight: 800;
        font-size: clamp(34px, 6vw, 56px);
        line-height: 1.05;
        letter-spacing: -0.01em;
        margin: 16px 0 0;
      }

      .tst-sub {
        margin: 20px auto 0;
        max-width: 480px;
        font-size: 18px;
        line-height: 1.6;
        color: rgba(7, 31, 53, 0.55);
        font-weight: 300;
      }

      .tst-section {
        max-width: 820px;
        margin: 0 auto;
        padding: 56px 24px 8px;
      }

      .tst-cohort {
        margin: 0 0 8px;
      }

      .tst-cohort-toggle {
        display: flex;
        align-items: baseline;
        gap: 10px;
        width: 100%;
        margin: 0;
        padding: 0 8px;
        border: 0;
        border-radius: 0;
        background: none;
        box-shadow: none;
        cursor: pointer;
        text-align: left;
        font-family: "Raleway", sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(7, 31, 53, 0.35);
      }

      .tst-cohort-toggle:hover,
      .tst-cohort-toggle:active,
      .tst-cohort-toggle:focus-visible {
        color: rgba(7, 31, 53, 0.6);
        box-shadow: none;
        transform: none;
        filter: none;
        outline: none;
      }

      .tst-cohort-count {
        font-weight: 600;
        letter-spacing: 0.08em;
        color: rgba(7, 31, 53, 0.3);
      }

      .tst-cohort-chevron {
        margin-left: auto;
        font-size: 22px;
        font-weight: 300;
        line-height: 1;
        letter-spacing: 0;
        transition: transform 0.3s ease;
      }

      .tst-cohort-toggle[aria-expanded="true"] .tst-cohort-chevron {
        transform: rotate(45deg);
      }

      .tst-cohort-toggle[aria-expanded="false"] {
        padding-bottom: 20px;
        border-bottom: 1px solid rgba(7, 31, 53, 0.08);
      }

      /* Two independent columns (first half / second half) so opening a story
         only pushes down its own column, and mobile stacks in original order. */
      .tst-list {
        display: grid;
        grid-template-columns: 1fr;
      }

      .tst-list[hidden] {
        display: none;
      }

      .tst-col {
        border-top: 1px solid rgba(7, 31, 53, 0.08);
        min-width: 0;
      }

      .tst-col:empty {
        display: none;
      }

      .tst-list .tst-col + .tst-col {
        border-top: 0;
      }

      @media (min-width: 760px) {
        .tst-section {
          max-width: 1040px;
        }

        .tst-list {
          grid-template-columns: 1fr 1fr;
          column-gap: 40px;
          align-items: start;
        }

        .tst-list .tst-col + .tst-col {
          border-top: 1px solid rgba(7, 31, 53, 0.08);
        }
      }

      .tst-row {
        border-bottom: 1px solid rgba(7, 31, 53, 0.08);
        padding: 22px 8px;
        cursor: pointer;
        transition: background 0.2s ease;
        list-style: none;
      }

      .tst-row:hover,
      .tst-row:focus-visible {
        background: rgba(7, 31, 53, 0.02);
        outline: none;
      }

      .tst-row-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
      }

      .tst-name {
        font-family: "Raleway", sans-serif;
        font-weight: 700;
        font-size: 19px;
      }

      .tst-note {
        margin-left: 10px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(7, 31, 53, 0.4);
      }

      .tst-quote {
        margin: 6px 0 0;
        padding-right: 32px;
        font-size: 15px;
        line-height: 1.55;
        font-style: italic;
        font-weight: 300;
        color: rgba(7, 31, 53, 0.55);
      }

      .tst-plus {
        font-size: 22px;
        font-weight: 300;
        color: rgba(7, 31, 53, 0.35);
        flex-shrink: 0;
        transform: rotate(0deg);
        transition: transform 0.3s ease;
      }

      .tst-row.is-open .tst-plus {
        transform: rotate(45deg);
      }

      .tst-content {
        height: 0;
        overflow: hidden;
        opacity: 0;
        transition: height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      }

      .tst-row.is-open .tst-content {
        opacity: 1;
      }

      .tst-content-inner p {
        margin: 16px 0 0;
        font-size: 16px;
        line-height: 1.75;
        color: rgba(7, 31, 53, 0.72);
        font-weight: 300;
        max-width: 680px;
      }

      .tst-content-inner p + p {
        margin-top: 12px;
      }

      .tst-cta {
        max-width: 480px;
        margin: 0 auto;
        padding: 64px 24px 140px;
        text-align: center;
      }

      .tst-cta p {
        margin: 0 0 16px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(7, 31, 53, 0.4);
      }

      .tst-cta a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        padding: 0 28px;
        border-radius: 24px;
        background: #071f35;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
      }

      #testimonialAdminPanel {
        max-width: 820px;
        margin: 0 auto 40px;
        padding: 0 24px;
      }

      #testimonialAdminPanel .admin-box {
        border-radius: 16px;
        background: #fff;
        border: 1px solid rgba(7, 31, 53, 0.1);
        padding: 20px;
      }

      #testimonialAdminForm input,
      #testimonialAdminForm textarea {
        width: 100%;
        box-sizing: border-box;
        border-radius: 12px;
        border: 1px solid rgba(7, 31, 53, 0.15);
        padding: 10px 12px;
        font-size: 14px;
        font-family: inherit;
      }

      #testimonialAdminForm button {
        border-radius: 12px;
        background: #071f35;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        padding: 10px 18px;
        border: none;
        cursor: pointer;
        justify-self: start;
      }
    </style>
  </head>

  <body>
    <div data-admin-edit-root>
      <div class="tst-hero">
        <p class="tst-eyebrow">Testimonials</p>
        <h1 class="tst-title">Real people.<br />Real change.</h1>
        <p class="tst-sub">Tap a name to read the story.</p>
      </div>

      <div id="testimonialAdminPanel" class="hidden">
        <div class="admin-box">
          <h3 style="margin:0 0 12px; font-family:Raleway,sans-serif; font-weight:800; font-size:18px;">Add testimonial</h3>
          <form id="testimonialAdminForm" style="display:grid; gap:10px;">
            <input id="adminName" type="text" placeholder="Name" required />
            <input id="adminYear" type="text" placeholder="Year (e.g. 2026)" required />
            <input id="adminQuote" type="text" placeholder="One-line quote shown under the name (optional)" />
            <textarea id="adminBody" rows="5" placeholder="Paragraphs separated by blank lines" required></textarea>
            <button type="submit">Add testimonial</button>
          </form>
        </div>
      </div>

      <div id="testimonialGrid"></div>

      <div class="tst-cta">
        <p>Ready to chase change?</p>
        <a href="https://tally.so/r/w5JXKE" target="_blank" rel="noopener noreferrer">Apply for 1:1 Coaching</a>
      </div>
    </div>

    <script>
      const testimonialGrid = document.getElementById("testimonialGrid");

      const createTestimonialRow = (testimonial) => {
        const row = document.createElement("div");
        row.className = "tst-row";
        row.setAttribute("role", "button");
        row.setAttribute("tabindex", "0");
        row.setAttribute("aria-expanded", "false");

        const head = document.createElement("div");
        head.className = "tst-row-head";

        const nameWrap = document.createElement("div");
        const name = document.createElement("span");
        name.className = "tst-name";
        name.textContent = testimonial.name;
        nameWrap.appendChild(name);
        if (testimonial.note) {
          const note = document.createElement("span");
          note.className = "tst-note";
          note.textContent = testimonial.note;
          nameWrap.appendChild(note);
        }

        const plus = document.createElement("span");
        plus.className = "tst-plus";
        plus.setAttribute("aria-hidden", "true");
        plus.textContent = "+";

        head.appendChild(nameWrap);
        head.appendChild(plus);
        row.appendChild(head);

        if (testimonial.quote) {
          const quote = document.createElement("p");
          quote.className = "tst-quote";
          quote.textContent = `“${testimonial.quote}”`;
          row.appendChild(quote);
        }

        const content = document.createElement("div");
        content.className = "tst-content";
        content.setAttribute("aria-hidden", "true");

        const inner = document.createElement("div");
        inner.className = "tst-content-inner";
        testimonial.paragraphs.forEach((paragraph) => {
          const p = document.createElement("p");
          p.textContent = paragraph;
          inner.appendChild(p);
        });
        content.appendChild(inner);

        row.appendChild(content);
        return row;
      };

      const isValidTestimonial = (item) =>
        item?.name && item?.year && Array.isArray(item?.paragraphs) && item.paragraphs.length;
      const normalizeTestimonialKey = (item) => `${item?.name || ""}::${item?.year || ""}`.toLowerCase();

      const savedTestimonials = window.CCTestimonialsStore?.load() || [];
      const defaultTestimonials = window.CCTestimonialsStore?.defaults || [];
      const mergedTestimonialsMap = new Map();

      defaultTestimonials.forEach((item) => {
        if (!isValidTestimonial(item)) return;
        mergedTestimonialsMap.set(normalizeTestimonialKey(item), item);
      });

      savedTestimonials.forEach((item) => {
        if (!isValidTestimonial(item)) return;
        mergedTestimonialsMap.set(normalizeTestimonialKey(item), item);
      });

      const testimonialsByYear = new Map();
      Array.from(mergedTestimonialsMap.values()).forEach((item) => {
        if (!isValidTestimonial(item)) return;
        const year = String(item.year);
        if (!testimonialsByYear.has(year)) testimonialsByYear.set(year, []);
        testimonialsByYear.get(year).push(item);
      });

      const sortedYears = Array.from(testimonialsByYear.keys()).sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));

      sortedYears.forEach((year, index) => {
        const items = testimonialsByYear.get(year);
        const isExpanded = index === 0; // newest cohort open, older ones collapsed
        const listId = `tst-list-${year}`;

        const section = document.createElement("section");
        section.className = "tst-section";

        const heading = document.createElement("h2");
        heading.className = "tst-cohort";

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "tst-cohort-toggle";
        toggle.setAttribute("aria-expanded", String(isExpanded));
        toggle.setAttribute("aria-controls", listId);

        const label = document.createElement("span");
        label.textContent = `${year} Cohort`;
        const count = document.createElement("span");
        count.className = "tst-cohort-count";
        count.textContent = `${items.length} ${items.length === 1 ? "story" : "stories"}`;
        const chevron = document.createElement("span");
        chevron.className = "tst-cohort-chevron";
        chevron.setAttribute("aria-hidden", "true");
        chevron.textContent = "+";
        toggle.append(label, count, chevron);
        heading.appendChild(toggle);

        const list = document.createElement("div");
        list.className = "tst-list";
        list.id = listId;
        list.hidden = !isExpanded;

        const splitAt = Math.ceil(items.length / 2);
        [items.slice(0, splitAt), items.slice(splitAt)].forEach((columnItems) => {
          const col = document.createElement("div");
          col.className = "tst-col";
          columnItems.forEach((item) => col.appendChild(createTestimonialRow(item)));
          list.appendChild(col);
        });

        toggle.addEventListener("click", () => {
          const willExpand = list.hidden;
          list.hidden = !willExpand;
          toggle.setAttribute("aria-expanded", String(willExpand));
        });

        section.appendChild(heading);
        section.appendChild(list);
        testimonialGrid.appendChild(section);
      });

      const bindRowInteractions = () => {
        const rows = document.querySelectorAll(".tst-row");

        const closeRow = (row) => {
          const content = row.querySelector(".tst-content");
          const inner = row.querySelector(".tst-content-inner");
          if (!content || !inner) return;
          content.style.height = `${inner.scrollHeight}px`;
          requestAnimationFrame(() => {
            row.classList.remove("is-open");
            row.setAttribute("aria-expanded", "false");
            content.setAttribute("aria-hidden", "true");
            content.style.height = "0px";
          });
        };

        const openRow = (row) => {
          const content = row.querySelector(".tst-content");
          const inner = row.querySelector(".tst-content-inner");
          if (!content || !inner) return;
          row.classList.add("is-open");
          row.setAttribute("aria-expanded", "true");
          content.setAttribute("aria-hidden", "false");
          content.style.height = `${inner.scrollHeight}px`;
        };

        const syncOpenHeights = () => {
          rows.forEach((row) => {
            if (!row.classList.contains("is-open")) return;
            const content = row.querySelector(".tst-content");
            if (!content) return;
            content.style.height = "auto";
          });
        };

        rows.forEach((row) => {
          const toggleRow = () => {
            const isOpen = row.classList.contains("is-open");
            rows.forEach((item) => {
              if (item !== row && item.classList.contains("is-open")) {
                closeRow(item);
              }
            });
            if (isOpen) {
              closeRow(row);
            } else {
              openRow(row);
            }
          };

          row.addEventListener("click", toggleRow);
          row.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            toggleRow();
          });

          const content = row.querySelector(".tst-content");
          content?.addEventListener("transitionend", (event) => {
            if (event.propertyName !== "height" || !row.classList.contains("is-open")) return;
            // Release the pixel height so later reflows (e.g. web fonts swapping in)
            // can't leave the bottom of long testimonials clipped by overflow: hidden.
            content.style.height = "auto";
          });
        });
        window.addEventListener("resize", syncOpenHeights);
        syncOpenHeights();
      };

      const testimonialAdminPanel = document.getElementById("testimonialAdminPanel");
      const testimonialAdminForm = document.getElementById("testimonialAdminForm");
      const isAdminUnlocked = localStorage.getItem("ccAdminUnlocked") === "true";
      testimonialAdminPanel?.classList.toggle("hidden", !isAdminUnlocked);

      testimonialAdminForm?.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = document.getElementById("adminName").value.trim();
        const year = document.getElementById("adminYear").value.trim();
        const quote = document.getElementById("adminQuote").value.trim().replace(/^["“]|["”]$/g, "");
        const paragraphs = document.getElementById("adminBody").value
          .split(/\n\s*\n/g)
          .map((item) => item.trim())
          .filter(Boolean);
        if (!name || !year || !paragraphs.length) return;

        const next = window.CCTestimonialsStore?.load() || [];
        next.push(quote ? { name, year, quote, paragraphs } : { name, year, paragraphs });
        window.CCTestimonialsStore?.save(next);
        location.reload();
      });

      bindRowInteractions();
    </script>

    <footer class="w-full px-5 pb-5 sm:px-8" style="text-align:center;">
      <p style="margin:0; font-size:12px; color:rgba(7,31,53,0.7);">© 2026 Chasing Change — 1% better every day.</p>
    </footer>
  </body>
</html>
